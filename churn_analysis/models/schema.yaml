version: 2

models:
  # ============================================================
  # STAGING LAYER
  # ============================================================
  
  - name: stg_customers
    description: |
      Cleaned and standardized customer data from raw seed.
      This is the foundation layer where we:
      - Add customer_id (auto-generated)
      - Standardize column names
      - Prepare for feature engineering
    
    columns:
      - name: customer_id
        description: Unique identifier for each customer (auto-generated via ROW_NUMBER())
        tests:
          - unique
          - not_null
      
      - name: churn
        description: Target variable - whether customer churned (1) or not (0)
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      
      - name: tenure
        description: Number of months customer has been with company
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      
      - name: satisfaction_score
        description: Customer satisfaction rating (1-5 scale)
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      
      - name: has_complained
        description: Binary flag - has customer complained (1=yes, 0=no)
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      
      - name: cashback_amount
        description: Total cashback amount received by customer
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000

      - name: tenure_missing_flag
        description: Binary - tenure was originally missing (1=yes, 0=no)
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: warehouse_missing_flag
        description: Binary - warehouse_to_home was originally missing (1=yes, 0=no)
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: days_missing_flag
        description: Binary - days_since_last_order was originally missing (1=yes, 0=no)
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: preferred_order_category
        description: Raw product category - encoded in marts layer
        tests:
          - not_null
          - accepted_values:
              values: ['Laptop & Accessory', 'Mobile Phone',
                       'Fashion', 'Grocery', 'Others']

      - name: marital_status
        description: Raw marital status - encoded in marts layer
        tests:
          - not_null
          - accepted_values:
              values: ['Single', 'Married', 'Divorced']
  
  # ============================================================
  # INTERMEDIATE LAYER
  # ============================================================
  
  - name: int_customer_lifecycle
    description: |
      Customer lifecycle segmentation based on tenure.
      Segments customers into risk categories:
      - brand_new: 0 months (54.3% - CRITICAL RISK!)
      - new_high_risk: 1-3 months (35.1% churn)
      - growing_moderate: 4-6 months (7.0% churn)
      - maturing_stable: 7-12 months (5.5% churn)
      - established_loyal: 12+ months (~5% churn)
      - missing_tenure: tenure was missing (30.0% churn - ELEVATED RISK!)
                        (NOT the same as brand_new - data gap customers)
    
    columns:
      - name: customer_id
        description: Foreign key to stg_customers
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      
      - name: lifecycle_stage
        description: Customer lifecycle stage based on tenure
        tests:
          - not_null
          - accepted_values:
              values: [
                  'brand_new', 
                  'new_high_risk', 
                  'growing_moderate', 
                  'maturing_stable', 
                  'established_loyal', 
                  'missing_tenure'
                ]
      
      - name: is_new_customer
        description: Binary flag for customers <= 3 months old
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

      - name: is_missing_tenure
        description: Binary flag for customers with missing tenure
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
  
  - name: int_recency_risk
    description: |
      Recency-based risk segmentation handling U-shaped pattern.
      recent_new_customer: 0-7d = new customers testing (16.8% churn)
      active_low_risk: 8-14d (9.3% churn)
      stable_lowest_risk: 15-30d (2.6% churn - sweet spot!)
      dormant_high_risk: 31+d (2 customers: business logic high risk - 
                              churn rate unreliable but segment conceptually valid)
    
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      
      - name: recency_risk
        description: Risk category based on days since last order
        tests:
          - not_null
          - accepted_values:
              values: ['recent_new_customer', 'active_low_risk', 
                      'stable_lowest_risk', 'dormant_high_risk']
  
  - name: int_product_risk
    description: |
      Product category risk segmentation.
      Mobile Phone buyers: 26.9% churn (highest risk)
      Grocery buyers: 4.1% churn (lowest risk)
    
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      
      - name: product_risk_category
        description: Risk level based on product preferences
        tests:
          - not_null
          - accepted_values:
              values: ['high_risk_tech', 'moderate_risk_fashion', 
                      'low_risk_electronics', 'lowest_risk_grocery', 'low_risk_other']
  
  - name: int_demographic_stability
    description: |
      Marital status risk segmentation.
      Single: 25.8% churn (unstable_high_risk)
      Divorced: 15.5% churn (moderate_risk)
      Married: 10.9% churn (stable_low_risk)
    
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      
      - name: demographic_stability
        description: Stability level based on marital status
        tests:
          - not_null
          - accepted_values:
              values: ['unstable_high_risk', 'moderate_risk', 'stable_low_risk']
  
  - name: int_customer_value
    description: |
      Customer value segmentation and spending velocity metrics.
      cashback_per_month = cashback / tenure (top predictor in ML model)
    
    columns:
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      
      - name: cashback_per_month
        description: Spending velocity
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      
      - name: value_tier
        description: Customer value tier based on total cashback
        tests:
          - not_null
          - accepted_values:
              values: ['high_value', 'medium_value', 'low_value']
  
  # ============================================================
  # FEATURES LAYER
  # ============================================================
  
  - name: fct_customer_churn_features
    description: |
      Final ML-ready feature table combining all engineered features.
      14 features + composite_risk_score + target variable (churn). 
      
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_customers')
    
    columns:
      - name: customer_id
        description: Primary key
        tests:
          - unique
          - not_null
      
      - name: churn
        description: Target variable for ML model
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      
      - name: composite_risk_score
        description: |
          Composite risk score (0-5) combining 5 key risk factors:
          - New customer (+1)
          - Tech buyer (+1)
          - Has complained (+1)
          - Single (+1)
          - Dormant (+1)
          
          Validation: Score 4-5 customers have 73.7% churn rate!
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5]
      
      - name: cashback_per_month
        description: Top predictor in ML model - spending velocity
        tests:
          - not_null
      
      - name: lifecycle_stage
        tests:
          - not_null
      
      - name: recency_risk
        tests:
          - not_null
      
      - name: product_risk_category
        tests:
          - not_null
      
      - name: demographic_stability
        tests:
          - not_null
      
      - name: value_tier
        tests:
          - not_null


      
